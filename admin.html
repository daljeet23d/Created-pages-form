<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f8}.header{background:#111;color:#fff;text-align:center;padding:22px}.header h1{margin:0 0 5px}.wrap{max-width:850px;margin:auto;padding:18px}.tools{display:flex;gap:8px;margin-bottom:15px}.search{flex:1;padding:13px;border:1px solid #ddd;border-radius:10px}.refresh{padding:13px 16px;background:#111;color:#fff;border:0;border-radius:10px}.card{background:#fff;padding:18px;border-radius:14px;margin-bottom:12px;box-shadow:0 3px 15px #0001}.card h3{margin:0 0 10px}.info{margin:8px 0;color:#555}.tag{display:inline-block;background:#111;color:#fff;padding:6px 10px;border-radius:20px;font-size:13px}.del{margin-top:12px;padding:9px 13px;background:#e53935;color:#fff;border:0;border-radius:8px}.empty{text-align:center;background:#fff;padding:35px;border-radius:14px}
</style>
</head>
<body>
<div class="header"><h1>🛠 Admin Panel</h1><div>User Submissions</div></div>
<div class="wrap">
<div class="tools"><input id="searchBox" class="search" placeholder="Search name, number or Gmail"><button class="refresh" type="button" id="refreshButton">🔄</button></div>
<b id="userCount">Total Users: 0</b>
<div id="userList" style="margin-top:12px"></div>
</div>
<script>
// @ts-nocheck
const STORAGE_KEY="create_page_users";
const searchBox=document.getElementById("searchBox");
const userList=document.getElementById("userList");
const userCount=document.getElementById("userCount");

function escapeHTML(value){
return String(value||"").replace(/[&<>"']/g,function(char){
return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char];
});
}

function renderUsers(){
const allUsers=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
const query=searchBox.value.toLowerCase().trim();

const filteredUsers=allUsers.filter(function(user){
return (user.name+" "+user.phone+" "+user.email+" "+user.platform).toLowerCase().includes(query);
});

userCount.textContent="Total Users: "+allUsers.length;

if(filteredUsers.length===0){
userList.innerHTML='<div class="empty"><h3>📭 No submissions</h3><p>User data yahan show hovega.</p></div>';
return;
}

userList.innerHTML=filteredUsers.map(function(user){
return '<div class="card">'+
'<h3>👤 '+escapeHTML(user.name)+'</h3>'+
'<div class="info">📱 <b>Mobile:</b> '+escapeHTML(user.phone)+'</div>'+
'<div class="info">📧 <b>Gmail:</b> '+escapeHTML(user.email)+'</div>'+
'<span class="tag">🌐 '+escapeHTML(user.platform)+'</span>'+
'<div class="info">🕒 '+escapeHTML(user.submittedAt)+'</div>'+
'<button class="del" type="button" data-id="'+user.id+'">🗑 Delete</button>'+
'</div>';
}).join("");

document.querySelectorAll(".del").forEach(function(button){
button.addEventListener("click",function(){
const id=Number(button.getAttribute("data-id"));
if(!confirm("Delete this user?"))return;
const users=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]").filter(function(user){return user.id!==id;});
localStorage.setItem(STORAGE_KEY,JSON.stringify(users));
renderUsers();
});
});
}

searchBox.addEventListener("input",renderUsers);
document.getElementById("refreshButton").addEventListener("click",renderUsers);
renderUsers();
</script>
</body>
</html>
